name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release Septaris
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      # ----------------------------------------------------------
      # NODE
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ----------------------------------------------------------
      # VERSION
      # ----------------------------------------------------------

      - name: Validate version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: X.Y.Z"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

          echo "Release version: $VERSION"

      # ----------------------------------------------------------
      # DUPLICATE CHECK
      # ----------------------------------------------------------

      - name: Check tag does not already exist
        shell: bash
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi

      # ----------------------------------------------------------
      # CODE QUALITY BEFORE RELEASE
      # ----------------------------------------------------------

      - name: Run Biome
        run: npm run ci

      # ----------------------------------------------------------
      # UPDATE PACKAGE.JSON + PACKAGE-LOCK.JSON
      # ----------------------------------------------------------

      - name: Update npm version
        run: |
          npm version "$VERSION" --no-git-tag-version

      # ----------------------------------------------------------
      # UPDATE SYSTEM.JSON
      # ----------------------------------------------------------

      - name: Update Foundry manifest
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");

          const path = "system.json";

          const system = JSON.parse(
            fs.readFileSync(path, "utf8")
          );

          const version = process.env.VERSION;

          const repository =
            `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;

          system.version = version;

          system.url = repository;

          system.manifest =
            `${repository}/releases/latest/download/system.json`;

          system.download =
            `${repository}/releases/download/v${version}/septaris.zip`;

          fs.writeFileSync(
            path,
            JSON.stringify(system, null, 2) + "\n"
          );

          console.log(`Updated system.json to ${version}`);
          EOF

      # ----------------------------------------------------------
      # FORMAT GENERATED FILES
      # ----------------------------------------------------------

      - name: Format release files
        run: |
          npx biome format --write \
            package.json \
            package-lock.json \
            system.json

      # ----------------------------------------------------------
      # VALIDATE GENERATED FILES
      # ----------------------------------------------------------

      - name: Validate release files
        run: |
          npx biome ci \
            package.json \
            package-lock.json \
            system.json

      # ----------------------------------------------------------
      # VERIFY VERSIONS
      # ----------------------------------------------------------

      - name: Verify versions
        shell: bash
        run: |
          SYSTEM_VERSION=$(node -p "require('./system.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")

          echo "Requested version: $VERSION"
          echo "system.json:       $SYSTEM_VERSION"
          echo "package.json:      $PACKAGE_VERSION"
          echo "package-lock.json: $LOCK_VERSION"

          if [ "$SYSTEM_VERSION" != "$VERSION" ]; then
            echo "system.json version mismatch"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "package.json version mismatch"
            exit 1
          fi

          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "package-lock.json version mismatch"
            exit 1
          fi

      # ----------------------------------------------------------
      # VERIFY MANIFEST URLS
      # ----------------------------------------------------------

      - name: Verify manifest URLs
        shell: bash
        run: |
          REPOSITORY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          EXPECTED_MANIFEST="${REPOSITORY}/releases/latest/download/system.json"
          EXPECTED_DOWNLOAD="${REPOSITORY}/releases/download/v${VERSION}/septaris.zip"

          MANIFEST=$(node -p "require('./system.json').manifest")
          DOWNLOAD=$(node -p "require('./system.json').download")
          URL=$(node -p "require('./system.json').url")

          echo "Repository: $REPOSITORY"
          echo "Manifest:   $MANIFEST"
          echo "Download:   $DOWNLOAD"

          if [ "$URL" != "$REPOSITORY" ]; then
            echo "Invalid repository URL"
            exit 1
          fi

          if [ "$MANIFEST" != "$EXPECTED_MANIFEST" ]; then
            echo "Invalid manifest URL"
            echo "Expected: $EXPECTED_MANIFEST"
            echo "Got:      $MANIFEST"
            exit 1
          fi

          if [ "$DOWNLOAD" != "$EXPECTED_DOWNLOAD" ]; then
            echo "Invalid download URL"
            echo "Expected: $EXPECTED_DOWNLOAD"
            echo "Got:      $DOWNLOAD"
            exit 1
          fi

      # ----------------------------------------------------------
      # COMMIT RELEASE VERSION
      # ----------------------------------------------------------

      - name: Commit release version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            system.json

          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 1
          fi

          git commit -m "chore(release): v${VERSION} [skip ci]"

          git push origin HEAD:main

      # ----------------------------------------------------------
      # CREATE TAG
      # ----------------------------------------------------------

      - name: Create release tag
        shell: bash
        run: |
          git tag "v${VERSION}"

          git push origin "v${VERSION}"

      # ----------------------------------------------------------
      # BUILD FOUNDRY PACKAGE
      # ----------------------------------------------------------

      - name: Build Foundry package
        shell: bash
        run: |
          mkdir -p dist

          zip -r dist/septaris.zip \
            system.json \
            assets \
            lang \
            scripts \
            styles \
            templates

          cp system.json dist/system.json

      # ----------------------------------------------------------
      # VERIFY RELEASE PACKAGE
      # ----------------------------------------------------------

      - name: Verify release package
        shell: bash
        run: |
          echo "Release files:"
          ls -lah dist

          echo ""
          echo "septaris.zip contents:"
          unzip -l dist/septaris.zip

          echo ""
          echo "Manifest version:"
          node -p "require('./dist/system.json').version"

      # ----------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ----------------------------------------------------------

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            dist/septaris.zip \
            dist/system.json \
            --title "Septaris v${VERSION}" \
            --generate-notes